[binaries]
fortran = 'ifort'
ar = 'xiar'

[built-in options]
fortran_args = ['-coarray=single', '-qopenmp', '-O3', '-xCORE-AVX512', '-qopt-zmm-usage=high', '-no-prec-div', '-qmkl', '-warn', 'all', '-assume', 'byterecl']
